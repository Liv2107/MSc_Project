# PURPOSE
# Centralise development-tool settings so formatting, linting, typing, and tests use
# the same rules on every machine. This is not a dependency lock file and does not
# claim the project is packaged for release yet.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

# IMPLEMENTATION CHECKLIST
# [ ] Confirm Python 3.11+ is available (StrEnum is used in the scaffold).
# [ ] Run ruff after implementing each module; do not mechanically erase teaching comments.
# [ ] Tighten mypy settings as third-party type coverage becomes clear.
# [ ] Add coverage thresholds only after meaningful tests exist.
