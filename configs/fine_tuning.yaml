# PURPOSE
# Measure recovery after limited labelled exposure to the previously unseen generator.
# Percentages refer only to its persisted adaptation pool, never its final test set.

base_config: base.yaml

experiment:
  type: fine_tuning
  name: limited_data_recovery

generators:
  train: [generator_a, generator_b, generator_c]
  validation: [generator_a, generator_b, generator_c]
  test: [generator_d]
  unseen: generator_d
  include_real_images: true

fine_tuning:
  # 5% probes very-low-data recovery; 10% modest exposure; 20% an intermediate
  # regime; 50% a substantial but still limited reference. Always report counts.
  percentages: [0.05, 0.10, 0.20, 0.50]
  subset_seeds: [42, 123, 456]
  nested_subsets: true
  adaptation_split_name: adaptation_pool
  final_test_split_name: unseen_test
  # Must be the best_checkpoint.pt written by the matching unseen-generator run: the
  # recovery curve is measured relative to that run's 0% result. The runner refuses a
  # checkpoint trained on a different CLIP revision, held-out generator, or known
  # generator set, so an incomparable starting point fails fast rather than quietly.
  starting_checkpoint: outputs/REPLACE_WITH_UNSEEN_RUN_DIRECTORY/best_checkpoint.pt
  reload_starting_checkpoint_each_run: true
  fine_tune_mode: head_only
  # Predeclared small-data selection policy: the adaptation pool is split ONCE,
  # group-safely and per class, into adaptation-train and adaptation-validation pools.
  # Every percentage then takes nested prefixes of BOTH, so the reported budget covers
  # model selection as well as fitting and the final test partition is never consulted.
  adaptation_validation_fraction: 0.2

training:
  epochs: 5
  learning_rate: 0.00001
  fine_tune_mode: head_only

# IMPLEMENTATION CHECKLIST
# [ ] Replace/check starting checkpoint, manifest hash, and split identity.
# [x] Save nested subset IDs and actual counts for every subset seed.
# [x] Keep adaptation validation and final test completely separate.
# [x] Reload identical starting weights for each independent percentage/seed run.
# [x] Evaluate the same final-test IDs and combine results with the measured 0% run.
#
# GRID SIZE: 4 percentages x 3 subset seeds x 3 training seeds = 36 fitted models per
# held-out generator. Shorten subset_seeds/experiment_seeds while developing and state
# the final grid in the dissertation.
