# Leave-one-generator-out on Tiny GenImage, holding out wukong.
# Produces the 0%-adaptation reference for a wukong recovery curve.
#
# This is the SECOND-CHOICE harder held-out generator. wukong is the second hardest
# generator in the all-seven baseline (per-generator ROC-AUC 0.8994, PR-AUC 0.5939),
# behind vqdm (0.8652) and well behind the completed biggan condition (0.9761).
#
# CAVEAT TO STATE IF THIS CONDITION IS USED. wukong is a Chinese Stable Diffusion
# variant, and stable_diffusion_v1_5 REMAINS IN TRAINING here. The two share a
# continuous-latent diffusion architecture, so a detector trained without wukong still
# sees a close sibling. Any measured gap is therefore a lower bound on the degradation
# a genuinely novel architecture would cause, and the write-up must say so.
# configs/tiny_unseen_vqdm.yaml does not have this confound.
#
# The final test set is built balanced 50/50 (all wukong test fakes plus an equal number
# of reals from a FIXED real pool shared across held-out generators), so precision, F1,
# and PR-AUC are comparable against the biggan condition and the in-distribution set.

base_config: tiny_genimage_base.yaml

experiment:
  type: unseen_generator
  name: tiny_unseen_wukong

generators:
  train: [vqdm, stable_diffusion_v1_5, biggan, adm, glide, midjourney]
  validation: [vqdm, stable_diffusion_v1_5, biggan, adm, glide, midjourney]
  test: [wukong]
  unseen: wukong
  include_real_images: true

unseen_protocol:
  # Must be 1.0: the adaptation pool is the held-out generator's WHOLE official-train
  # slice, while the final test partition comes from the official-val slice, so the two
  # are already provenance disjoint. The runner rejects any other value.
  adaptation_fraction: 1.0
  adaptation_split_name: adaptation_pool
  final_test_split_name: unseen_test
  fixed_real_test_pool: true
