# biggan depth ablation: 3 modes x 4 budgets, one subset/training seed.
# Shared checkpoint, subsets and test set; learning rates differ by depth.
# Rationale and probe results: docs/experiment-design.md.

base_config: tiny_genimage_base.yaml

experiment:
  type: ablation
  name: tiny_ablation_biggan

generators:
  train: [vqdm, stable_diffusion_v1_5, wukong, adm, glide, midjourney]
  validation: [vqdm, stable_diffusion_v1_5, wukong, adm, glide, midjourney]
  test: [biggan]
  unseen: biggan
  include_real_images: true

fine_tuning:
  percentages: [0.05, 0.10, 0.20, 0.50]
  subset_seeds: [42]
  nested_subsets: true
  adaptation_split_name: adaptation_pool
  final_test_split_name: unseen_test
  # The same checkpoint configs/tiny_recovery_biggan.yaml adapted from, so the depth
  # comparison and the existing head-only recovery curve share one 0% origin.
  starting_checkpoint: outputs/unseen_generator-20260808T151948963300Z-c74c3e0db3-363b/best_checkpoint.pt
  reload_starting_checkpoint_each_run: true
  fine_tune_mode: head_only
  adaptation_validation_fraction: 0.2

ablation:
  modes: [head_only, last_block, full]
  control_starting_checkpoint: true
  control_subset_ids: true
  control_final_test_ids: true
  training_budget_policy: equal_epochs
  record_trainable_parameter_names: true
  record_training_time: true

# Per-depth rates from the BigGAN validation probe; see docs/experiment-design.md.
mode_overrides:
  head_only: null
  last_block:
    learning_rate: 0.00001
  full:
    learning_rate: 0.00001
