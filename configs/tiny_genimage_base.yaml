# Tiny GenImage has seven generators; Stable Diffusion v1.4 is absent.
# Import with --tiny-genimage --preprocess to record provenance and normalise
# image format and size. Report results as Tiny GenImage, not full GenImage.

base_config: base.yaml

data:
  root: data
  manifest_path: data/manifests/tiny_genimage.csv
  split_path: data/manifests/tiny_genimage_splits.csv

training:
  epochs: 10
  batch_size: 32
  num_workers: 0
  learning_rate: 0.001
  fine_tune_mode: head_only
  # No CUDA on the development machine; enable with mixed_precision on a GPU host.
  mixed_precision: false

reproducibility:
  seed: 42
  # Single-seed experiments do not estimate run-to-run variation.
  experiment_seeds: [42]
  deterministic_algorithms: true
