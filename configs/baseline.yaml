# In-distribution reference: train and evaluate on the declared known generators. This
# shows the pipeline can learn the task, but says nothing about whether performance
# transfers to a new generator.

base_config: base.yaml

experiment:
  type: baseline
  name: baseline_known_generators

generators:
  # Placeholders. Replace with names that exactly match the validated manifest.
  train: [generator_a, generator_b, generator_c]
  validation: [generator_a, generator_b, generator_c]
  test: [generator_a, generator_b, generator_c]
  unseen: null
  include_real_images: true

training:
  fine_tune_mode: head_only
