# Confirmatory cosine-head comparison with wukong held out.
# See docs/experiment-design.md for the original hypothesis and decision rules.
# All settings except head_type match the corresponding linear-head config.

base_config: tiny_genimage_base.yaml

experiment:
  type: unseen_generator
  name: tiny_unseen_wukong_cosine

model:
  # The only difference from configs/tiny_unseen_wukong.yaml.
  head_type: cosine

generators:
  train: [vqdm, stable_diffusion_v1_5, biggan, adm, glide, midjourney]
  validation: [vqdm, stable_diffusion_v1_5, biggan, adm, glide, midjourney]
  test: [wukong]
  unseen: wukong
  include_real_images: true

unseen_protocol:
  adaptation_fraction: 1.0
  adaptation_split_name: adaptation_pool
  final_test_split_name: unseen_test
  fixed_real_test_pool: true
